name: Deploy Storybook to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm build-storybook
        env:
          NODE_OPTIONS: --max-old-space-size=4096

      # Site layout: landing page at the root, Storybook under /storybook/.
      # site/index.html forwards legacy /?path=... links to ./storybook/.
      # __VERSION__ in the landing is stamped from package.json so the
      # displayed version can never go stale.
      - run: |
          mkdir -p _site
          cp -r site/. _site/
          sed -i "s/__VERSION__/$(node -p "require('./package.json').version")/g" _site/index.html
          cp -r storybook-static _site/storybook
          # llms.txt convention (llmstxt.org): serve the AI-readable docs at
          # the site root so agents and crawlers can fetch them directly
          cp llms.txt llms-full.txt _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
